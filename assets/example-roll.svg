<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 386" role="img" aria-label="A roll in Discord: !r 2d20kh1+5 Goblin returns an embed titled 22, with the dice 17 kept and 9 struck through, and a +5 modifier">
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="677" height="383" rx="14" fill="#1E1B18" stroke="#3A342E" stroke-width="3"/>

  <!-- channel header -->
  <text x="28" y="38" class="sans" font-size="14" fill="#7A7871">#</text>
  <text x="40" y="38" class="sans" font-size="14" fill="#A8A69F">dice-table</text>
  <line x1="20" y1="52" x2="660" y2="52" stroke="#2A2622" stroke-width="1"/>

  <!-- the command -->
  <circle cx="46" cy="88" r="18" fill="#3A5A8A"/>
  <text x="46" y="94" class="sans" font-size="16" font-weight="600" fill="#F5EFE6" text-anchor="middle">P</text>
  <text x="76" y="82" class="sans" font-size="15" font-weight="600" fill="#F5EFE6">Phobetore</text>
  <text x="162" y="82" class="sans" font-size="11" fill="#7A7871">today at 21:04</text>
  <text x="76" y="104" class="mono" font-size="15" fill="#D8D2C8">!r 2d20kh1+5 Goblin</text>

  <!-- the reply -->
  <circle cx="46" cy="152" r="18" fill="#A24E33"/>
  <rect x="38" y="144" width="16" height="16" rx="4" fill="#F5EFE6"/>
  <circle cx="42.5" cy="148.5" r="1.6" fill="#A24E33"/>
  <circle cx="49.5" cy="148.5" r="1.6" fill="#A24E33"/>
  <circle cx="42.5" cy="155.5" r="1.6" fill="#A24E33"/>
  <circle cx="49.5" cy="155.5" r="1.6" fill="#A24E33"/>
  <circle cx="46" cy="152" r="1.6" fill="#A24E33"/>
  <text x="76" y="146" class="sans" font-size="15" font-weight="600" fill="#F5EFE6">SirrMizan</text>
  <rect x="156" y="134" width="34" height="16" rx="4" fill="#5865F2"/>
  <text x="173" y="146" class="sans" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">BOT</text>
  <text x="198" y="146" class="sans" font-size="11" fill="#7A7871">today at 21:04</text>

  <!-- the embed, drawn as Discord renders it -->
  <rect x="76" y="162" width="430" height="196" rx="8" fill="#26221E"/>
  <rect x="76" y="162" width="5" height="196" rx="2.5" fill="#3498DB"/>

  <!-- title -->
  <text x="98" y="192" class="sans" font-size="17" font-weight="700" fill="#F5EFE6">🎲 22</text>

  <!-- description: the expression, then the target -->
  <text x="98" y="218" class="sans" font-size="14" fill="#D8D2C8">
    <tspan class="mono" fill="#E08C5F">2d20kh1+5</tspan><tspan dx="8">for</tspan><tspan dx="5" font-weight="700" fill="#F5EFE6">Goblin</tspan>
  </text>

  <!-- field: Dice -->
  <text x="98" y="248" class="sans" font-size="13" font-weight="700" fill="#F5EFE6">Dice</text>
  <text x="98" y="270" class="sans" font-size="14" fill="#D8D2C8">
    <tspan class="mono" fill="#E08C5F">2d20kh1</tspan><tspan dx="8">→</tspan><tspan dx="6" font-weight="700" fill="#F5EFE6">17</tspan><tspan dx="10" fill="#7A7871" text-decoration="line-through">9</tspan><tspan dx="10">=</tspan><tspan dx="6" font-weight="700" fill="#F5EFE6">17</tspan>
  </text>

  <!-- field: Modifiers -->
  <text x="98" y="300" class="sans" font-size="13" font-weight="700" fill="#F5EFE6">Modifiers</text>
  <text x="98" y="322" class="sans" font-size="14" fill="#D8D2C8">+5</text>

  <!-- footer -->
  <circle cx="105" cy="341" r="8" fill="#3A5A8A"/>
  <text x="105" y="345" class="sans" font-size="9" font-weight="600" fill="#F5EFE6" text-anchor="middle">P</text>
  <text x="120" y="345" class="sans" font-size="12" fill="#8A8880">Rolled by Phobetore</text>
</svg>
